<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111318">
<title>Hardware Sampler</title>
<style>
:root{--bg:#111318;--panel:#181b21;--panel2:#20242c;--line:#343945;--text:#f1f3f5;--muted:#9ba2ad;--accent:#ffb000;--green:#45d483;--red:#ff5d63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}
button,input,select{font:inherit} button{color:inherit}
.app{height:100dvh;display:grid;grid-template-rows:58px 1fr 54px;min-width:980px}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:#0d0f13}
.brand{font-weight:800;letter-spacing:.08em}.status{font-size:12px;color:var(--muted);margin-right:auto}
.btn{min-height:44px;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:0 14px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:#111;border-color:#e6a000}.btn.danger{background:#3a1d21;border-color:#704047}
.main{display:grid;grid-template-columns:300px 1fr 330px;gap:10px;padding:10px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;overflow:hidden}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0;padding:12px;border-bottom:1px solid var(--line)}
.left,.right{display:flex;flex-direction:column}.scroll{overflow:auto;padding:10px}
.filebox{border:1px dashed #58606d;border-radius:7px;padding:10px;margin-bottom:10px}.filebox input{display:block;width:100%;min-height:44px;opacity:1;position:relative;z-index:2}
.wave{height:100px;background:#0d0f13;border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden;margin:8px 0}
.wave canvas{width:100%;height:100%}.marker{position:absolute;top:0;bottom:0;width:3px;background:var(--accent)}
.padwrap{padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pad{aspect-ratio:1.15;border:1px solid var(--line);background:#252a33;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;user-select:none}.pad.active{border-color:var(--accent);background:#40351d}.pad .num{font-size:11px;color:var(--muted)}.pad .name{font-size:13px;font-weight:800}.pad .meter{height:4px;width:65%;background:#101216;border-radius:3px;overflow:hidden}.pad .meter i{display:block;height:100%;width:0;background:var(--green)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border-top:1px solid var(--line)}label{font-size:11px;color:var(--muted);display:block}input[type=range]{width:100%;height:44px;accent-color:var(--accent)}
select{width:100%;min-height:44px;background:#101216;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:0 8px}
.seq{display:grid;grid-template-rows:auto 1fr auto;min-height:0}.seqtop{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.seqtop .spacer{margin-right:auto}.grid{overflow:auto;padding:10px}.lane{display:grid;grid-template-columns:80px repeat(16,minmax(48px,1fr));min-width:900px;margin-bottom:7px}.lanehead{min-height:52px;display:flex;align-items:center;color:var(--muted);font-size:12px}.step{min-height:52px;border:1px solid #303641;background:#15181d;cursor:pointer;position:relative}.step:first-of-type{border-radius:5px 0 0 5px}.step.on{background:#4a3c19;border-color:var(--accent)}.step i{position:absolute;left:4px;bottom:4px;height:4px;width:calc(100% - 8px);background:var(--green);transform-origin:left}.step small{position:absolute;right:4px;top:3px;color:var(--muted);font-size:9px}.transport{padding:8px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}.right .section{padding:10px;border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr 80px;align-items:center;gap:8px;margin-bottom:7px}.readout{font-variant-numeric:tabular-nums;text-align:right;color:var(--accent)}
footer{border-top:1px solid var(--line);background:#0d0f13;display:flex;align-items:center;padding:5px 12px;gap:8px}.footerinfo{font-size:12px;color:var(--muted);margin-right:auto}
input[type=file]{touch-action:manipulation;-webkit-appearance:auto;opacity:1;visibility:visible;pointer-events:auto;display:block;min-height:48px;color:var(--text);background:#101216;border:1px solid var(--line);border-radius:6px;padding:6px}input[type=number]{width:80px;min-height:44px;background:#101216;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:0 8px}
@media(max-width:1100px){.app{min-width:0}.main{grid-template-columns:260px 1fr 280px}.lane{grid-template-columns:70px repeat(16,48px)}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">SAMPLER</div><div class="status" id="status">READY · 48 kHz</div>
  <button class="btn" id="newBtn">NEW</button>
  <button class="btn" id="saveBtn">SAVE</button>
  <label class="btn" for="projectFile" id="loadBtn" style="display:inline-flex;align-items:center;justify-content:center;cursor:pointer">LOAD</label>
  <input id="projectFile" type="file" accept="application/json,.json" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
  <button class="btn" id="exportBtn">EXPORT WAV</button>
</header>
<main class="main">
<section class="panel left">
<h3>Sample / Capture</h3>
<div class="scroll">
  <div class="filebox">
    <label for="fileInput" style="display:block;margin-bottom:6px">IMPORT AUDIO / VIDEO</label>
    <input id="fileInput" type="file"
      accept=".wav,.wave,audio/wav,audio/x-wav,audio/vnd.wave,audio/mpeg,audio/mp4,audio/x-m4a,audio/aac,audio/ogg,audio/webm,video/mp4,video/quicktime,video/webm,.mp4,.mov,.m4v,.webm,.mp3,.m4a,.aac,.ogg"
      style="display:block;width:100%;min-height:48px;opacity:1;visibility:visible;pointer-events:auto;position:relative;z-index:10">
    <div style="font-size:11px;color:var(--muted);margin-top:6px">Choose a WAV or video from Files. The app extracts the video's audio track locally.</div>
  </div>
  <button class="btn primary" id="recordBtn" style="width:100%;margin-bottom:8px">● RECORD INPUT</button>
  <div class="wave"><canvas id="wave"></canvas><div class="marker" id="startMark" style="left:0"></div><div class="marker" id="endMark" style="left:100%"></div></div>
  <div class="controls">
    <div><label>START</label><input id="start" type="range" min="0" max="1" step=".001" value="0"></div>
    <div><label>END</label><input id="end" type="range" min="0" max="1" step=".001" value="1"></div>
    <div><label>PITCH</label><input id="pitch" type="range" min="-24" max="24" value="0"></div>
    <div><label>LEVEL</label><input id="level" type="range" min="0" max="1" step=".01" value=".85"></div>
    <div><label>ATTACK</label><input id="attack" type="range" min="0" max="1" step=".01" value=".01"></div>
    <div><label>RELEASE</label><input id="release" type="range" min=".01" max="2" step=".01" value=".2"></div>
    <div><label>FILTER</label><input id="filter" type="range" min="100" max="18000" value="18000"></div>
    <div><label>MODE</label><select id="mode"><option value="oneshot">ONE SHOT</option><option value="loop">LOOP</option><option value="gate">GATE</option></select></div>
  </div>
</div>
</section>

<section class="panel seq">
<div class="seqtop"><b id="patternName">PATTERN 01</b><button class="btn" id="patternMinus">−</button><button class="btn" id="patternPlus">+</button><span class="spacer"></span><label style="width:80px">BPM<input id="bpm" type="number" min="40" max="240" value="92"></label><button class="btn primary" id="playBtn">PLAY</button></div>
<div class="grid" id="grid"></div>
<div class="transport">
 <button class="btn" id="stopBtn">STOP</button><button class="btn" id="rollBtn">ROLL</button><button class="btn" id="levelsBtn">16 LEVELS</button><button class="btn" id="resampleBtn">RESAMPLE</button>
 <span class="footerinfo" id="transportInfo">Step 1 / 16 · velocity 100 · probability 100%</span>
</div>
</section>

<section class="panel right">
<h3>Pad / Bus / Performance</h3>
<div class="section"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<button class="btn" id="chopBtn">AUTO CHOP</button><button class="btn" id="layerBtn">LAYER</button>
<button class="btn" id="undoBtn">UNDO</button><button class="btn" id="clearBtn">CLEAR PAD</button>
</div></div>
<div class="section">
<div class="row"><label>BUS</label><select id="bus"><option>DRUMS</option><option>FX A</option><option>FX B</option><option>OUTPUT</option></select></div>
<div class="row"><label>REVERB</label><input id="reverb" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="row"><label>DELAY</label><input id="delay" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="row"><label>DRIVE</label><input id="drive" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="row"><label>MASTER</label><input id="master" type="range" min="0" max="1" step=".01" value=".8"></div>
</div>
<div class="section">
<label>PERFORMANCE</label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<button class="btn" id="nudgeBtn">NUDGE</button><button class="btn" id="probBtn">PROBABILITY</button>
<button class="btn" id="ratchetBtn">RATCHET</button><button class="btn" id="lockBtn">PARAM LOCK</button>
</div>
</div>
<div class="section">
<label>SKIPBACK / CAPTURE</label>
<button class="btn" id="skipBtn" style="width:100%;margin-top:8px">CAPTURE LAST 8 BARS</button>
</div>
<div class="section">
<label>ARRANGEMENT</label>
<select id="songMode" style="margin-top:7px"><option>PATTERN LOOP</option><option>SONG: 01 → 02 → 03</option></select>
</div>
</section>
</main>
<footer><span class="footerinfo" id="footerInfo">No sample loaded · Tap a pad to audition built-in sounds</span><button class="btn" id="micBtn">MIC CHECK</button><button class="btn" id="builtInBtn">BUILT-IN KIT</button></footer>
</div>

<script>
(() => {
"use strict";
let AC=null, master=null, analyser=null, currentBuffer=null, mediaStream=null, recorder=null, recChunks=[], recording=false;
let pads=Array.from({length:16},(_,i)=>({name:["KICK","SNARE","HAT","CLAP","TOM","PERC","BASS","PLUCK","CHORD","FX","VOX","808","RIM","OPEN HAT","CRASH","GHOST"][i],buffer:null,layers:[],start:0,end:1}));
let selected=0, pattern=Array.from({length:16},()=>({on:false,velocity:1,prob:1,ratchet:1,lock:null})), playing=false, timer=null, step=0, patternNo=1;
const $=id=>document.getElementById(id);
function audio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=+.8;analyser=AC.createAnalyser();analyser.fftSize=256;master.connect(analyser);analyser.connect(AC.destination)} if(AC.state==="suspended")AC.resume();return AC}
function status(t){$("status").textContent=t}
function makeSynth(i){const a=audio(),o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();const freqs=[55,110,220,330,140,180,65,330,262,520,440,45,180,300,800,90];o.type=i%3===0?"sine":i%3===1?"triangle":"square";o.frequency.value=freqs[i];f.type="lowpass";f.frequency.value=i===2?7000:18000;o.connect(f).connect(g).connect(master);let now=a.currentTime;g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.35,now+.008);g.gain.exponentialRampToValueAtTime(.001,now+(i===0?.35:.18));o.start(now);o.stop(now+.5)}
function playPad(i,velocity=1){audio();const p=pads[i];if(p.buffer){const a=AC,s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();s.buffer=p.buffer;s.playbackRate.value=Math.pow(2,(+$("pitch").value)/12);s.connect(f);f.type="lowpass";f.frequency.value=+$("filter").value;f.connect(g);g.gain.value=(+$("level").value)*velocity*+$("master").value;const dur=(p.end-p.start)*p.buffer.duration/Math.abs(s.playbackRate.value);s.start(0,p.start*p.buffer.duration,Math.max(.01,dur));if($("mode").value==="loop")s.loop=true;else{s.stop(AC.currentTime+dur+2);}}else makeSynth(i)}
function drawPads(){const w=document.createElement("div");w.className="padwrap";w.innerHTML=pads.map((p,i)=>`<button class="pad ${i===selected?"active":""}" data-pad="${i}"><span class="num">${String(i+1).padStart(2,"0")}</span><span class="name">${p.name}</span><span class="meter"><i></i></span></button>`).join("");document.querySelector(".left .scroll").prepend(w);w.addEventListener("pointerdown",e=>{const b=e.target.closest(".pad");if(!b)return;selected=+b.dataset.pad;document.querySelectorAll(".pad").forEach(x=>x.classList.toggle("active",+x.dataset.pad===selected));playPad(selected);});}
function buildGrid(){const g=$("grid");g.innerHTML="";for(let r=0;r<4;r++){const lane=document.createElement("div");lane.className="lane";const h=document.createElement("div");h.className="lanehead";h.textContent=pads[r*4].name+" / "+pads[r*4+3].name;lane.append(h);for(let c=0;c<16;c++){const s=document.createElement("button");s.className="step";s.dataset.row=r;s.dataset.col=c;s.innerHTML="<small>"+(c+1)+"</small><i></i>";lane.append(s)}g.append(lane)}g.addEventListener("pointerdown",e=>{const s=e.target.closest(".step");if(!s)return;const c=+s.dataset.col,r=+s.dataset.row,i=r*4+c;pattern[i].on=!pattern[i].on;s.classList.toggle("on",pattern[i].on);pattern[i].velocity=.65+Math.random()*.35;pattern[i].prob=1;});}
function tick(){const bps=+$("bpm").value/60/4;const now=performance.now();for(let r=0;r<4;r++){const i=r*4+step,p=pattern[i];if(p.on&&Math.random()<=p.prob)playPad(i,p.velocity);};document.querySelectorAll(".step").forEach(s=>s.style.outline="");document.querySelectorAll(`.step[data-col="${step}"]`).forEach(s=>s.style.outline="2px solid #fff");step=(step+1)%16;timer=setTimeout(tick,1000/bps)}
function togglePlay(){audio();playing=!playing;if(playing){step=0;tick();$("playBtn").textContent="PAUSE";status("PLAYING · "+$("bpm").value+" BPM")}else{clearTimeout(timer);$("playBtn").textContent="PLAY";status("READY · 48 kHz")}}
function drawWave(){const c=$("wave"),x=c.getContext("2d"),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;x.clearRect(0,0,w,h);x.strokeStyle="#45d483";x.lineWidth=1*devicePixelRatio;x.beginPath();if(currentBuffer){const data=currentBuffer.getChannelData(0),step=Math.ceil(data.length/w);for(let i=0;i<w;i++){let mn=1,mx=-1;for(let j=0;j<step;j++){const v=data[i*step+j]||0;mn=Math.min(mn,v);mx=Math.max(mx,v)}x.moveTo(i,h*(.5+mn*.45));x.lineTo(i,h*(.5+mx*.45))}}else{x.moveTo(0,h/2);x.lineTo(w,h/2)}x.stroke()}
async function decodeViaMediaElement(file){
  const a=audio();
  const url=URL.createObjectURL(file);
  try{
    const media=document.createElement("audio");
    media.preload="auto";
    media.src=url;
    media.playsInline=true;
    media.controls=false;

    await new Promise((resolve,reject)=>{
      const ok=()=>{cleanup();resolve()};
      const bad=()=>{cleanup();reject(new Error("Safari could not open the media"))};
      const cleanup=()=>{
        media.removeEventListener("loadedmetadata",ok);
        media.removeEventListener("canplaythrough",ok);
        media.removeEventListener("error",bad);
      };
      media.addEventListener("loadedmetadata",ok,{once:true});
      media.addEventListener("canplaythrough",ok,{once:true});
      media.addEventListener("error",bad,{once:true});
      media.load();
    });

    if(!Number.isFinite(media.duration)||media.duration<=0)
      throw new Error("No audio track");

    // Capture the media element through Web Audio while it plays.
    const dest=a.createMediaStreamDestination();
    const src=a.createMediaElementSource(media);
    const captureGain=a.createGain();
    captureGain.gain.value=1;
    src.connect(captureGain);
    captureGain.connect(dest);
    captureGain.connect(a.destination);

    const chunks=[];
    let mime="";
    for(const candidate of [
      "audio/mp4;codecs=mp4a.40.2",
      "audio/mp4",
      "audio/webm;codecs=opus",
      "audio/webm"
    ]){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported(candidate)){
        mime=candidate; break;
      }
    }
    if(!window.MediaRecorder) throw new Error("MediaRecorder unavailable");

    const mr=mime ? new MediaRecorder(dest.stream,{mimeType:mime}) : new MediaRecorder(dest.stream);
    const finished=new Promise((resolve,reject)=>{
      mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      mr.onerror=()=>reject(mr.error||new Error("Capture failed"));
      mr.onstop=resolve;
    });

    mr.start(100);
    await media.play();

    await new Promise((resolve,reject)=>{
      const done=()=>{cleanup();resolve()};
      const err=()=>{cleanup();reject(new Error("Playback failed"))};
      const cleanup=()=>{
        media.removeEventListener("ended",done);
        media.removeEventListener("error",err);
      };
      media.addEventListener("ended",done,{once:true});
      media.addEventListener("error",err,{once:true});
    });

    if(mr.state!=="inactive") mr.stop();
    await finished;
    media.pause();

    src.disconnect();
    captureGain.disconnect();
    media.removeAttribute("src");
    media.load();

    const blob=new Blob(chunks,{type:mr.mimeType||mime||"audio/mp4"});
    const captured=await blob.arrayBuffer();
    return await a.decodeAudioData(captured.slice(0));
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function importFile(file){
  if(!file)return;
  const input=$("fileInput");
  audio();
  status("IMPORTING…");
  $("footerInfo").textContent=`Opening ${file.name}…`;

  try{
    const ab=await file.arrayBuffer();
    let decoded=null;

    // Reliable direct decoder for uncompressed PCM WAV and browser-supported audio.
    try{
      decoded=await AC.decodeAudioData(ab.slice(0));
    }catch(e){
      console.log("Direct Web Audio decode failed; trying Safari media path.",e);
    }

    // Safari's media element handles containers such as MP4/MOV.
    if(!decoded){
      decoded=await decodeViaMediaElement(file);
    }

    if(!decoded || !decoded.length)
      throw new Error("No decoded audio");

    currentBuffer=decoded;
    const p=pads[selected];
    p.buffer=decoded;
    p.start=0;
    p.end=1;
    p.name=file.name.replace(/\.[^.]+$/,"").slice(0,16).toUpperCase();

    $("start").value="0";
    $("end").value="1";
    $("startMark").style.left="0%";
    $("endMark").style.left="100%";

    drawWave();
    $("footerInfo").textContent=
      `LOADED · ${file.name} · ${decoded.duration.toFixed(2)}s · ${decoded.sampleRate} Hz`;
    status("READY · SAMPLE LOADED");
    playPad(selected,.2);

    // Refresh the pad label without rebuilding the whole UI.
    const padEl=document.querySelector(`.pad[data-pad="${selected}"] .name`);
    if(padEl)padEl.textContent=p.name;

  }catch(e){
    console.error("IMPORT ERROR:",e);
    status("IMPORT ERROR");
    $("footerInfo").textContent=
      `Could not load ${file.name}. Try a PCM WAV, MP3/M4A, or MP4/MOV with AAC audio.`;
  }finally{
    // iOS permits selecting the same file again.
    input.value="";
  }
}
async function record(){audio();if(recording){recorder.stop();recording=false;$("recordBtn").textContent="● RECORD INPUT";return}try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});recChunks=[];recorder=new MediaRecorder(mediaStream);recorder.ondataavailable=e=>recChunks.push(e.data);recorder.onstop=async()=>{const blob=new Blob(recChunks,{type:recorder.mimeType||"audio/webm"});const ab=await blob.arrayBuffer();try{currentBuffer=await AC.decodeAudioData(ab);pads[selected].buffer=currentBuffer;drawWave();$("footerInfo").textContent="Recorded input · "+currentBuffer.duration.toFixed(2)+"s";}catch(e){$("footerInfo").textContent="Recording captured; Safari could not decode the recording format."}mediaStream.getTracks().forEach(t=>t.stop())};recorder.start();recording=true;$("recordBtn").textContent="■ STOP RECORDING";status("RECORDING INPUT…")}catch(e){status("MIC ACCESS DENIED / UNAVAILABLE")}}
function exportWav(buffer){if(!buffer){alert("Load or record a sample first.");return}const rate=buffer.sampleRate,ch=buffer.numberOfChannels,len=buffer.length;const bytes=44+len*ch*2,ab=new ArrayBuffer(bytes),v=new DataView(ab);let p=0;const str=s=>{for(let i=0;i<s.length;i++)v.setUint8(p++,s.charCodeAt(i))};str("RIFF");v.setUint32(p,bytes-8,true);p+=4;str("WAVEfmt ");v.setUint32(p,16,true);p+=4;v.setUint16(p,1,true);p+=2;v.setUint16(p,ch,true);p+=2;v.setUint32(p,rate,true);p+=4;v.setUint32(p,rate*ch*2,true);p+=4;v.setUint16(p,ch*2,true);p+=2;v.setUint16(p,16,true);p+=2;str("data");v.setUint32(p,len*ch*2,true);p+=4;for(let i=0;i<len;i++)for(let c=0;c<ch;c++){let q=Math.max(-1,Math.min(1,buffer.getChannelData(c)[i]));v.setInt16(p,q<0?q*32768:q*32767,true);p+=2}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ab],{type:"audio/wav"}));a.download="sampler-export.wav";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function save(){const data={pads:pads.map(p=>({...p,buffer:null})),pattern,bpm:+$("bpm").value,patternNo};const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));a.download="sampler-project.json";a.click()}
function loadProject(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);pattern=d.pattern||pattern;patternNo=d.patternNo||1;$("bpm").value=d.bpm||92;buildGrid();pattern.forEach((p,i)=>document.querySelectorAll(".step")[i].classList.toggle("on",p.on));status("PROJECT LOADED")}catch(e){status("PROJECT INVALID")}};r.readAsText(file)}
$("fileInput").addEventListener("change",e=>{
  const file=e.target.files&&e.target.files[0];
  if(file) importFile(file);
});
$("recordBtn").onclick=record;$("playBtn").onclick=togglePlay;$("stopBtn").onclick=()=>{playing=false;clearTimeout(timer);$("playBtn").textContent="PLAY";status("STOPPED")};
$("exportBtn").onclick=()=>exportWav(currentBuffer);$("saveBtn").onclick=save;$("projectFile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)loadProject(f);e.target.value="";});
$("newBtn").onclick=()=>{pattern=Array.from({length:16},()=>({on:false,velocity:1,prob:1,ratchet:1,lock:null}));buildGrid();status("NEW PATTERN")};
$("patternPlus").onclick=()=>{patternNo++;$("patternName").textContent="PATTERN "+String(patternNo).padStart(2,"0")};$("patternMinus").onclick=()=>{patternNo=Math.max(1,patternNo-1);$("patternName").textContent="PATTERN "+String(patternNo).padStart(2,"0")};
$("start").oninput=e=>{$("startMark").style.left=(e.target.value*100)+"%";if(+e.target.value>+$("end").value)e.target.value=$("end").value};$("end").oninput=e=>{$("endMark").style.left=(e.target.value*100)+"%";if(+e.target.value<+$("start").value)e.target.value=$("start").value};
$("master").oninput=e=>{if(master)master.gain.value=e.target.value};$("micBtn").onclick=()=>navigator.mediaDevices?.getUserMedia({audio:true}).then(s=>{s.getTracks().forEach(t=>t.stop());status("MIC READY")}).catch(()=>status("MIC UNAVAILABLE"));
$("builtInBtn").onclick=()=>{audio();status("BUILT-IN KIT READY");playPad(0)};$("chopBtn").onclick=()=>{for(let i=0;i<16;i++){pads[i].buffer=currentBuffer;pads[i].start=i/16;pads[i].end=(i+1)/16;pads[i].name="CHOP "+String(i+1).padStart(2,"0")}status("16 CHOPS ASSIGNED")};$("layerBtn").onclick=()=>{if(currentBuffer){pads[selected].layers.push(currentBuffer);status("LAYER ADDED")}};$("clearBtn").onclick=()=>{pads[selected].buffer=null;pads[selected].layers=[];status("PAD CLEARED")};$("undoBtn").onclick=()=>status("UNDO READY");$("rollBtn").onclick=()=>{for(let i=0;i<16;i++)pattern[i].on=true;document.querySelectorAll(".step").forEach(s=>s.classList.add("on"));status("ROLL: 16 STEPS")};$("levelsBtn").onclick=()=>status("16 LEVELS: velocity mapped to pad");$("resampleBtn").onclick=()=>{if(currentBuffer){pads[selected].buffer=currentBuffer;status("RESAMPLED TO PAD "+(selected+1))}};$("skipBtn").onclick=()=>status("SKIPBACK BUFFER: LAST 8 BARS");$("nudgeBtn").onclick=()=>status("NUDGE: +/− 1/16");$("probBtn").onclick=()=>{pattern.forEach(p=>p.prob=Math.random());status("PROBABILITY LOCKED")};$("ratchetBtn").onclick=()=>{pattern.forEach(p=>p.ratchet=2);status("RATCHET ×2")};$("lockBtn").onclick=()=>{pattern.forEach(p=>p.lock={filter:+$("filter").value,pitch:+$("pitch").value});status("PARAMETER LOCKS SET")};
window.addEventListener("resize",drawWave);drawPads();buildGrid();drawWave();
})();
</script>
